<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Central Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<script>
if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', () => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:99;background:#14161c;color:#e6e8ee;font:15px/1.5 system-ui,sans-serif;padding:40px;';
  d.innerHTML = '<h2>Grand Central Station needs to be served over HTTP</h2><p>Browsers block ES modules on <code>file://</code> pages. Either:</p><ul><li>open <b>dist/grand-central-station.html</b> instead (single-file build, works from disk), or</li><li>run a local server in this folder, e.g. <code>python -m http.server 8080</code> (or <code>start-windows.bat</code>), then open <a href="http://localhost:8080/" style="color:#f0b24f">http://localhost:8080/</a>.</li></ul>';
  document.body.append(d);
});
</script>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">GCS</span><span class="title">Grand Central Station</span></div>
    <div class="stat"><span class="lbl">Week</span><span id="st-week" class="val blocky">1</span></div>
    <div class="stat" id="quota-stat">
      <span class="lbl">Quota</span>
      <div id="quota-stars" class="stars" title="One star per 1,000 points"></div>
    </div>
    <span id="st-quota" class="sr-only">5,000</span>
    <span id="st-proj" class="sr-only"></span>
    <div class="spacer"></div>
    <div id="playback" class="hidden">
      <button data-speed="1" class="speed">½×</button>
      <button data-speed="2" class="speed active">1×</button>
      <button data-speed="4" class="speed">2×</button>
      <button data-speed="skip" class="speed">Skip</button>
    </div>
    <button id="btn-menu" title="Menu">☰</button>
    <!-- the week's progress line: hidden until the week runs (see renderWeekLine) -->
    <div id="wk-line" class="hidden"><div id="wk-line-fill"></div></div>
  </header>

  <main id="main">
    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="board-hint"></div>
      <div id="board-tools">
        <button id="btn-music" title="Music on (M)" aria-label="Music" aria-pressed="true">♪</button>
        <button id="btn-zoom-out" title="Zoom out (-)" aria-label="Zoom out">−</button>
        <button id="btn-zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="btn-zoom-fit" title="Fit board (0)" aria-label="Fit board">Fit</button>
      </div>
      <!-- the card in hand: its name, its details (the only way to read them
           on a touch screen) and the action that spends the money -->
      <div id="card-bar" class="hidden">
        <div id="card-bar-head">
          <span id="card-bar-title"></span>
          <button id="btn-card-info" class="toggle" title="Show or hide the details">⌄</button>
        </div>
        <div id="card-bar-prompt"></div>
        <div id="card-bar-desc"></div>
        <div id="card-bar-tools">
          <button id="btn-rotate" title="Rotate (R)">⟳ Rotate</button>
          <button id="btn-place" class="primary">Build here</button>
          <button id="btn-place-cancel" title="Cancel (Esc)">✕</button>
        </div>
      </div>
      <!-- Nothing left to spend: the big go button, and on Standard the way
           back out of the week under it -->
      <div id="run-stack" class="hidden">
        <button id="btn-run-big" class="primary">Run Week ▶</button>
        <button id="btn-redo-big" class="hidden">↺ Redo Week</button>
      </div>
      <!-- The shop floats over the bottom edge of the board. It folds itself
           away while the week runs, so the board gets the whole screen. -->
      <div id="shop">
        <div id="shop-actions">
          <div id="wallet">
            <div id="st-money" class="roller">$220</div>
            <div id="ap-pips" title="Action points"></div>
            <span id="st-ap" class="sr-only">2</span>
          </div>
          <button id="btn-reroll" title="Costs 1 action point">Reroll</button>
          <button id="btn-run" class="primary">Run Week ▶</button>
        </div>
        <div id="shop-cards"></div>
      </div>
    </div>
    <!-- glyphs come from CSS: the panel sits on the right on a wide screen and
         along the bottom on a narrow one, so the arrows have to turn with it -->
    <button id="side-tab" class="toggle hidden" title="Show the timeline" aria-label="Show the timeline"></button>
    <aside id="side">
      <button id="btn-side-toggle" class="toggle" title="Hide the timeline" aria-label="Hide the timeline"></button>
      <div id="side-panels">
        <section id="info-panel" class="panel hidden">
          <h3 id="info-title">Placing</h3>
          <div id="info-body"></div>
        </section>
        <section id="timeline-panel" class="panel">
          <h3>Timeline</h3>
          <div id="timeline"></div>
        </section>
        <section id="rules-panel" class="panel hidden">
          <h3>Ordinances &amp; effects</h3>
          <div id="rules-body"></div>
        </section>
      </div>
    </aside>
  </main>
</div>

<div id="popup" class="hidden"></div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
