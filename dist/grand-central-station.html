<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Central Station</title>
<style>
:root {
  --bg: #14161c; --panel: #1d2028; --panel2: #262a34; --line: #343946; --text: #e6e8ee; --muted: #9aa0b0;
  --accent: #f0b24f; --good: #6cc46c; --bad: #f05a7e; --blue: #4fa3e0;
  --t1: #6cc46c; --t2: #4fa3e0; --t3: #b98cf0; --t4: #f0b24f; --t5: #f05a7e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
button.primary { background: var(--accent); color: #1a1a1a; font-weight: 600; border-color: transparent; }
button.danger { border-color: var(--bad); color: var(--bad); }
button.small { padding: 3px 8px; font-size: 12px; }
small { color: var(--muted); }
.hidden { display: none !important; }
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
#topbar { display: flex; align-items: center; gap: 18px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; transition: background 0.6s; position: relative; }
#topbar.gold { background: linear-gradient(100deg, #6b4f12 0%, #b8892a 30%, #f5d67a 50%, #b8892a 70%, #6b4f12 100%); background-size: 300% 100%; animation: glint 3s linear infinite; color: #1a1408; }
#topbar.gold .lbl, #topbar.gold .title { color: #3a2c0a; }
@keyframes glint { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.val.blocky { font-family: "Courier New", Courier, ui-monospace, monospace; font-weight: 800; font-size: 24px; letter-spacing: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
button.toggle { padding: 0 6px; font-size: 12px; line-height: 20px; border-color: transparent; color: var(--muted); background: transparent; }
#side { position: relative; }
#btn-side-toggle { position: absolute; top: 4px; right: 6px; }
#side-tab { position: fixed; right: 0; top: 50%; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-right: none; border-radius: 6px 0 0 6px; padding: 10px 4px; }
#main.side-collapsed { grid-template-columns: 1fr; }
#main.side-collapsed #side { display: none; }
#wallet { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 4px; }
.roller { font-family: "Courier New", Courier, ui-monospace, monospace; font-weight: 800; font-size: 22px; letter-spacing: 2px; color: #ffcf5a; background: linear-gradient(180deg, #0c0e12 0%, #2b2f3a 45%, #0c0e12 100%); border: 2px solid #4a4f5c; border-radius: 6px; padding: 4px 12px; min-width: 120px; text-align: right; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.08); text-shadow: 0 0 6px rgba(255,207,90,0.6); }
#ap-pips { display: flex; gap: 5px; }
.pip { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; background: var(--accent); box-shadow: 0 0 6px rgba(240,178,79,0.6); }
.pip.empty { background: transparent; box-shadow: none; opacity: 0.6; }
.card.k-transport { background: linear-gradient(180deg, #2b3d6b, #1d2a48); }
.card.k-amenity { background: linear-gradient(180deg, #5a4025, #3a2a18); }
.card.k-utility { background: linear-gradient(180deg, #3a3f4c, #262a34); }
.card.k-lounge { background: linear-gradient(180deg, #56532e, #36341c); }
.card.k-upgrade { background: linear-gradient(180deg, #5a4a14, #3a300c); }
.card.k-bonus { background: linear-gradient(180deg, #4a2f5e, #2e1d3b); }
.card.k-structure { background: linear-gradient(180deg, #5a4230, #3a2a1e); }
#modal-box.event { animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1), glow 1.8s ease-in-out infinite; border-color: var(--accent); text-align: center; max-width: 560px; }
#modal-box.event h2 { font-size: 30px; margin: 8px 0; }
#modal-box.event .event-mult { font-size: 20px; color: var(--accent); font-weight: 700; }
@keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 12px rgba(240,178,79,0.25); } 50% { box-shadow: 0 0 34px rgba(240,178,79,0.7); } }
.boss-star { display: inline-block; animation: spin 2.4s linear infinite; font-size: 34px; color: var(--accent); }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
.logo { background: var(--accent); color: #1a1a1a; font-weight: 800; padding: 2px 6px; border-radius: 4px; letter-spacing: 1px; }
.title { font-weight: 600; }
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat .lbl, .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
#playback { display: flex; align-items: center; gap: 4px; }
#playback .speed.active { border-color: var(--accent); color: var(--accent); }
#main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
#board-wrap { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
#board { max-width: 100%; max-height: 100%; background: #0f1116; border-radius: 6px; touch-action: none; }
#board-hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--muted); pointer-events: none; }
#side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; display: flex; flex-direction: column; }
.panel { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.panel h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
#log-body { font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; }
#log-body div { padding: 1px 0; }
#shop { display: flex; gap: 10px; padding: 10px 28px 12px 12px; background: var(--panel); border-top: 1px solid var(--line); align-items: stretch; overflow-x: auto; position: relative; }
#btn-shop-toggle { position: absolute; top: 2px; right: 6px; }
#shop-collapsed { display: none; }
#shop.collapsed { padding: 4px 12px; }
#shop.collapsed #shop-cards, #shop.collapsed #shop-actions, #shop.collapsed #btn-shop-toggle { display: none; }
#shop.collapsed #shop-collapsed { display: flex; align-items: center; gap: 12px; width: 100%; }
#shop-collapsed .roller { font-size: 14px; padding: 2px 8px; min-width: 0; }
#shop-cards { display: flex; gap: 8px; flex: 1; }
.card { width: 112px; height: 180px; background: linear-gradient(180deg, var(--panel2), #20242e); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; text-align: center; gap: 2px; }
.card:hover { border-color: var(--accent); transform: translateY(-3px); transition: transform 0.1s; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.card.unaffordable { opacity: 0.5; }
.card .slot { font-size: 9px; height: 12px; line-height: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; }
.card .name { font-weight: 600; font-size: 11.5px; line-height: 1.15; height: 30px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
.card canvas { margin: 0; flex-shrink: 0; }
.card .icon { font-size: 30px; line-height: 76px; height: 76px; color: var(--accent); }
.card .sub { font-size: 10px; color: var(--muted); }
.card .cost { margin-top: auto; font-weight: 700; color: var(--accent); font-size: 13px; }
.card .tier { font-weight: 700; }
.tier1 { color: var(--t1); } .tier2 { color: var(--t2); } .tier3 { color: var(--t3); } .tier4 { color: var(--t4); } .tier5 { color: var(--t5); }
#shop-actions { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
#shop-actions button { min-width: 120px; line-height: 1.2; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
#modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto; }
#modal-box h2 { margin: 0 0 8px; }
#modal-box h3 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mode { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
.mode:hover { border-color: var(--accent); }
.mode.locked { opacity: 0.5; cursor: default; }
.mode .name { font-weight: 700; margin-bottom: 4px; }
.mode .desc { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btnrow { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; flex-wrap: wrap; }
table.stats { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
table.stats th, table.stats td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats th { color: var(--muted); font-weight: 500; }
.scorebar { height: 14px; background: var(--panel2); border-radius: 7px; overflow: hidden; margin: 6px 0; position: relative; }
.scorebar .fill { height: 100%; background: var(--good); }
.scorebar .fill.fail { background: var(--bad); }
.scorebar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.big { font-size: 22px; font-weight: 700; }
.good { color: var(--good); } .bad { color: var(--bad); } .accent { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.kv .k { color: var(--muted); }
.chain { font-size: 12px; }
.chain div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.event-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--panel2); font-size: 11px; margin-right: 4px; }
.warn { color: var(--accent); }
select { font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
@media (max-width: 900px) {
  #main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #side { border-left: none; border-top: 1px solid var(--line); max-height: 40vh; flex-direction: row; overflow-x: auto; }
  .panel { min-width: 240px; border-bottom: none; border-right: 1px solid var(--line); }
  .card { width: 150px; }
}

#popup { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); font-size: 13px; pointer-events: none; }
#popup.sticky { pointer-events: auto; }
#popup h4 { margin: 0 0 4px; font-size: 14px; }
#popup .desc { color: var(--muted); font-size: 12px; margin-top: 4px; }
#popup .kv { font-size: 12px; }
#chart { width: 100%; height: 190px; display: block; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 0 6px; }

#run-wrap { padding: 10px 12px 6px; }
#btn-run { width: 100%; padding: 10px; font-size: 15px; }
#btn-run-big { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; padding: 16px 32px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); animation: breathe 1.6s ease-in-out infinite; z-index: 3; }
@keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.06); } }
#timeline { position: relative; padding-left: 18px; }
#timeline::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.tl-row { position: relative; padding: 6px 8px; margin: 3px 0; border-radius: 6px; font-size: 13px; }
.tl-row::before { content: ''; position: absolute; left: -17px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.tl-row .wk { font-weight: 700; }
.tl-row .q { color: var(--muted); font-size: 11px; margin-left: 6px; }
.tl-row .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-row.past { color: var(--muted); }
.tl-row.past.ok::before { background: var(--good); }
.tl-row.past.fail::before { background: var(--bad); }
.tl-row.current { background: var(--panel2); border: 1px solid var(--accent); color: var(--text); }
.tl-row.current::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.tl-row.event { background: rgba(240,178,79,0.14); }
.tl-row.event::before { background: var(--accent); }
.tl-row.event .tag { color: var(--accent); font-weight: 700; }
.tl-row.ordinance { background: rgba(185,140,240,0.14); }
.tl-row.ordinance::before { background: var(--t3); }
.tl-row.ordinance .tag { color: var(--t3); font-weight: 700; }
.tl-row.last { opacity: 0.45; }

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">GCS</span><span class="title">Grand Central Station</span></div>
    <div class="stat"><span class="lbl">Week</span><span id="st-week" class="val blocky">1</span></div>
    <div class="stat"><span class="lbl">Quota</span><span id="st-quota" class="val blocky">5,000</span></div>
    <span id="st-proj" class="sr-only"></span>
    <div class="spacer"></div>
    <div id="playback" class="hidden">
      <span id="pb-tick" class="lbl">tick 0/20</span>
      <button data-speed="1" class="speed active">1×</button>
      <button data-speed="2" class="speed">2×</button>
      <button data-speed="4" class="speed">4×</button>
      <button data-speed="skip" class="speed">Skip</button>
    </div>
    <button id="btn-menu" title="Menu">☰</button>
  </header>

  <main id="main">
    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="board-hint"></div>
      <button id="btn-run-big" class="primary hidden">Run Week ▶</button>
    </div>
    <button id="side-tab" class="toggle hidden" title="Show side panel">◀</button>
    <aside id="side">
      <button id="btn-side-toggle" class="toggle" title="Collapse side panel">▶</button>
      <div id="run-wrap"><button id="btn-run" class="primary">Run Week ▶</button></div>
      <section id="info-panel" class="panel hidden">
        <h3 id="info-title">Placing</h3>
        <div id="info-body"></div>
      </section>
      <section id="timeline-panel" class="panel">
        <h3>Timeline</h3>
        <div id="timeline"></div>
      </section>
      <section id="rules-panel" class="panel hidden">
        <h3>Ordinances &amp; effects</h3>
        <div id="rules-body"></div>
      </section>
    </aside>
  </main>

  <footer id="shop">
    <button id="btn-shop-toggle" class="toggle" title="Collapse shop">⌄</button>
    <div id="shop-collapsed"><button id="btn-shop-expand">▲ Shop</button></div>
    <div id="shop-cards"></div>
    <div id="shop-actions">
      <div id="wallet">
        <div id="st-money" class="roller">$220</div>
        <div id="ap-pips" title="Action points"></div>
        <span id="st-ap" class="sr-only">2</span>
      </div>
      <button id="btn-reroll">Reroll<br><small>1 AP · $10</small></button>
      <button id="btn-wait">Wait<br><small>all AP · +interest</small></button>
    </div>
  </footer>
</div>

<div id="popup" class="hidden"></div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<script>
"use strict";
// ---- src/config.js
const __m_src_config_js = (() => {
// ============================================================================
// Grand Central Station - central tuning file.
// Every number that a designer might want to nudge lives here. The simulator,
// shop and UI read from this object; nothing else hardcodes balance values.
// Values marked "(doc: X)" differ from the original design document after
// harness testing; the original value is listed for reference.
// ============================================================================

const CONFIG = {
  // ---------------------------------------------------------------- run flow
  run: {
    startMoney: 220,            // (was 150) a comfortable first two weeks, then income is tight            // cash at week 1
    startAP: 2,
    apMilestones: { 6: 3, 12: 4, 20: 5 },   // week -> AP per week from then on
    winWeek: 16,                // win screen fires here; play continues (endless)
    eventEvery: 4,              // every Nth week is an event week
    ordinanceWeeks: [5, 12, 20],
    ordinanceChoices: 3,
    pickpocketsFromWeek: 8,
    rareTilesFromWeek: 10,
    apUpgradeFromWeek: 20,
    apUpgradeCost: 400,
  },

  // ------------------------------------------------------------------- quota
  quota: {
    base: 5000,                 // (doc: 3000) raised after harness testing
    growth: 1.28,               // (doc: 1.25) per-week multiplier
    // Quota(week) = base * growth^(week-1) * eventMultiplier * ordinanceMultiplier
  },

  // ----------------------------------------------------------------- economy
  economy: {
    rerollFees: [10, 25, 60, 150, 350],   // escalating, resets weekly; last value repeats
    waitInterestRate: 0.08,
    waitInterestCap: 100,
    tileCostScalePerTile: 0.06,           // (doc: 0.04) cost * (1 + this * tilesOnBoard)
    revenueScale: 0.35,                   // global multiplier on amenity revenue (doc values were far too generous)
    fareScale: 0.35,                      // global multiplier on fares (doc: 1.0)
    upgradeCosts: [60, 140, 300, 650],    // level 1->2, 2->3, 3->4, 4->5
    maxLevel: 5,
    deleteRefund: 0,                      // fraction of base cost refunded on delete
    strandedMultiplier: 0.5,              // stranded travellers bank value * this
  },

  // --------------------------------------------------------------- simulation
  sim: {
    ticks: 20,
    spawnTicks: 16,
    lastCallDeparture: true,   // every transport fires a final departure on the last tick; only walkers are stranded
    walkwaySpeed: 2,            // cells per tick while on a moving walkway
    waypointCount: 2,
    waypointSigma: 1.5,         // gaussian spread (cells) around the straight line
    sameTileWanderSigma: 2.5,   // spread when destination == origin (a wander)
    tierMatchExitBonus: 1.5,    // transport exit bonus when traveller tier == transport tier
    gateBudgetBonus: 2,         // extra stop budget for travellers who pass a security gate
    // Tier of a spawned traveller relative to the transport's tier
    tierSpread: { same: 0.78, down: 0.12, up: 0.10 },
    // Service roll: P = base * tierMatch * radiusFalloff * budgetFactor * (wifi bonus)
    tierMatch: [1.0, 0.6, 0.25, 0.05],     // by |tier gap|; last value repeats
    radiusFalloffMin: 0.4,                 // falloff at radius edge (1.0 when adjacent)
    // Waiting areas
    waitingStackValue: 0.10,               // final_multiplier = 1 + stacks * this
    frequentFlierStackValue: 0.16,
    frequentFlierMinTier: 3,
    // Bad actors
    pickpocketRate: 0.05,                  // share of spawns that are pickpockets (from week 8)
    pickpocketSteal: 0.15,                 // share of banked chain value stolen
    kioskPickpocketReduction: 0.25,        // each information kiosk reduces pickpocket rate by this (multiplicative floor 0)
    // WiFi hotspot
    wifiBonus: 0.10,
    wifiCap: 0.20,
    // Green space
    greenSpaceBudgetRestore: 1,
  },

  // --------------------------------------------------------------- travellers
  tiers: [
    // index = tier-1
    { symbol: '$',     base: 100,  fare: 2,  budget: 3, waitCap: 2, color: '#6cc46c' },
    { symbol: '$$',    base: 180,  fare: 5,  budget: 4, waitCap: 3, color: '#4fa3e0' },
    { symbol: '$$$',   base: 320,  fare: 12, budget: 5, waitCap: 4, color: '#b98cf0' },
    { symbol: '$$$$',  base: 600,  fare: 30, budget: 6, waitCap: 5, color: '#f0b24f' },
    { symbol: '$$$$$', base: 1200, fare: 75, budget: 8, waitCap: 6, color: '#f05a7e' },
  ],

  // Destination weight by tier gap (traveller tier - transport tier)
  destinationWeights: {
    same: 1.0, down1: 0.70, up1: 0.45, down2: 0.35, up2: 0.15, far: 0.05,
  },

  // ---------------------------------------------------------------- upgrades
  upgrades: {
    amenity:   { mult: 0.12, capacity: 0.25, revenue: 0.20, rate: 0.03 },  // per level
    transport: { batch: 0.15, mult: 0.08 },
  },

  // ------------------------------------------------------------------- shop
  shop: {
    slots: 5,
    // wildcard slot contents weights
    wildcard: { card: 3, rare: 2, bridge: 0, upgrade: 2, apUpgrade: 1, namedUpgrade: 2 },   // bridge: 0 = pulled from the shop for now (confusing to use)
    // Rarity: prefer tiles whose cost is close to targetCost(week)
    targetCostBase: 32,
    targetCostGrowth: 1.14,
    targetCostSigma: 0.75,     // in log-space
    bridgeCost: 80,
    roadReach: 4,              // road tiles may sit this many cells inland
  },

  // -------------------------------------------------------------- placement
  placement: {
    previewSeeds: 4,           // sims per estimate (with and without)
  },
};

function quotaForWeek(week, mode, extraMult = 1) {
  const growth = (mode && mode.quotaGrowth) || CONFIG.quota.growth;
  return Math.round(CONFIG.quota.base * Math.pow(growth, week - 1) * extraMult);
}

function apForWeek(week, mode) {
  let ap = (mode && mode.startAP) || CONFIG.run.startAP;
  for (const [w, v] of Object.entries(CONFIG.run.apMilestones)) {
    if (week >= Number(w)) ap = Math.max(ap, v);
  }
  return ap;
}

return { CONFIG, quotaForWeek, apForWeek };
})();
// ---- src/data/tiles.js
const __m_src_data_tiles_js = (() => {
// ============================================================================
// Tile catalogue. Pure data - the simulator interprets it.

const __m_src_sim_rng_js = (() => {
// Seeded PRNG (mulberry32). One stream per subsystem so that changing the
// number of calls in one system does not reshuffle another's rolls.
function hashString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}

class Rng {
  constructor(seed) {
    this.s = (typeof seed === 'string' ? hashString(seed) : seed >>> 0) || 0x9e3779b9;
  }
  next() {
    let t = (this.s += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }
  range(a, b) { return a + this.next() * (b - a); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[this.int(arr.length)]; }
  gauss() {
    // Box-Muller
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
  }
  weighted(items, weightOf) {
    let total = 0;
    for (const it of items) total += weightOf(it);
    if (total <= 0) return items[this.int(items.length)];
    let r = this.next() * total;
    for (const it of items) {
      r -= weightOf(it);
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
}

function makeStreams(seed, names) {
  const out = {};
  for (const n of names) out[n] = new Rng(hashString(String(seed) + ':' + n));
  return out;
}

return { hashString, Rng, makeStreams };

  ui.hover = cell; ui.edgeHover = edge;

}
function onPointerLeave() { ui.hover = null; ui.edgeHover = null; ui.hoverTileId = null; ui.ghost = null; hidePopup(false); renderInfo(); }

function onClick(e) {
  if (ui.mode === 'playback') return;
  const rect = renderer.canvas.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;

    const doPlace = () => {
      const r = G.buyTile(state, placement.card, placement.x, placement.y, placement.rot);

    if (ui.card.target === 'edge') {

    }
    const t = cell ? tileAtCell(cell.x, cell.y) : null;
    if (!t || !targetFilter(t)) { hint('Pick a highlighted tile'); return; }
    const r = ui.card.type === 'card' ? G.playCard(state, ui.card, { tileId: t.id }) : G.upgradeTile(state, ui.card, t.id);

  }

function onKey(e) {
  if (e.key === 'Escape') { hidePopup(true); if (ui.mode === 'place' || ui.mode === 'target') cancelMode(); else { ui.selectedTileId = null; renderInfo(); } }
  if ((e.key === 'r' || e.key === 'R') && ui.mode === 'place') { rotate(1); }

}

// ------------------------------------------------------------ playback
function startWeek() {
  if (state.phase !== 'shop') return;

  const r = G.runWeek(state);
  if (!r.ok) { hint(r.reason); return; }
  ui.mode = 'playback'; ui.pb.result = r.result; ui.pb.T = 0; ui.pb.playing = true; ui.pb.last = performance.now(); ui.summaryShown = false; ui.heat = false;
  ui.selectedTileId = null; hidePopup(true);

}

  ui.pb.T = ui.pb.result.ticks; ui.pb.playing = false;

  if (!ui.summaryShown) { ui.summaryShown = true; showSummary(); }
}
function setSpeed(s) {
  ui.pb.speed = s;
  document.querySelectorAll('#playback .speed').forEach(b => b.classList.toggle('active', b.dataset.speed === String(s)));

function frame(now) {
  if (state) {
    if (ui.mode === 'playback' && ui.pb.playing) {
      const dt = (now - ui.pb.last) / 1000;
      ui.pb.T += dt * TICKS_PER_SEC * (ui.pb.speed === 'skip' ? 1000 : ui.pb.speed);
      if (ui.pb.T >= ui.pb.result.ticks) finishPlayback();
      $('pb-tick').textContent = `tick ${Math.min(ui.pb.result.ticks, Math.floor(ui.pb.T))}/${ui.pb.result.ticks}`;
    }
    ui.pb.last = now;
    const m = mods();
    const closed = new Set(state.board.tiles.filter(t => t.kind === 'amenity' && effAmenity(t, m).closed).map(t => t.id));
    const selected = tileById(ui.selectedTileId), hover = tileById(ui.hoverTileId);
    const radiusTile = (ui.mode !== 'playback') ? ((selected && selected.kind === 'amenity') ? selected : (hover && hover.kind === 'amenity') ? hover : null) : null;
    renderer.draw({
      board: state.board, ghost: ui.mode === 'place' ? ui.ghost : null, selectedTile: selected, hoverTile: hover, radiusTile,
      highlightEdges: ui.ghost && ui.ghost.ok ? ui.ghost.claims.map(c => c.edge) : (ui.mode === 'target' && ui.card && ui.card.target === 'edge' ? Object.keys(state.board.edges).filter(e => state.board.edges[e] !== 'green') : null),

}

// ------------------------------------------------------------ modals
function openModal(...children) { const box = $('modal-box'); box.className = ''; box.innerHTML = ''; box.append(...children); $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

function drawHistoryChart(canvas, history) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 800, H = 190;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const padL = 44, padR = 10, padT = 12, padB = 24;
  const vals = history.flatMap(x => [x.score, x.quota]).filter(v => v > 0);
  const lo = Math.max(1, Math.min(...vals) / 1.6), hi = Math.max(...vals) * 1.25;
  const ly = v => padT + (H - padT - padB) * (1 - (Math.log(Math.max(v, lo)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)));
  const n = history.length, slot = (W - padL - padR) / n;
  g.font = '11px system-ui, sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle';
  // grid lines at 1, 2, 5 x 10^k
  for (let k = 3; k < 8; k++) for (const m of [1, 2, 5]) { const v = m * Math.pow(10, k); if (v < lo || v > hi) continue; const y = ly(v); g.strokeStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.fillStyle = '#9aa0b0'; g.fillText(v >= 1000 ? (v / 1000) + 'k' : v, padL - 6, y); }
  // bars
  history.forEach((x, i) => {
    const cx = padL + slot * (i + 0.5), bw = Math.min(28, slot * 0.6);
    const y = ly(x.score), base = H - padB;
    g.fillStyle = x.passed ? 'rgba(108,196,108,0.85)' : 'rgba(240,90,126,0.85)';
    g.fillRect(cx - bw / 2, y, bw, base - y);
    g.fillStyle = '#9aa0b0'; g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(x.week % CONFIG.run.eventEvery === 0 ? x.week + '★' : x.week, cx, base + 4);
  });
  // quota line
  g.strokeStyle = '#f0b24f'; g.lineWidth = 2; g.beginPath();
  history.forEach((x, i) => { const cx = padL + slot * (i + 0.5); const y = ly(x.quota); if (i === 0) g.moveTo(cx, y); else g.lineTo(cx, y); });
  g.stroke();
  history.forEach((x, i) => { const cx = padL + slot * (i + 0.5); g.fillStyle = '#f0b24f'; g.beginPath(); g.arc(cx, ly(x.quota), 3, 0, Math.PI * 2); g.fill(); });
  g.fillStyle = '#f0b24f'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.font = '600 11px system-ui, sans-serif';
  g.fillText('quota', padL + 4, padT + 2);
}

function showHeatBar() {

function continueFromSummary() {

    h('div', { class: 'choices' }, ...state.pendingOrdinance.map(k => h('div', { class: 'mode', onclick: () => { G.chooseOrdinance(state, k); closeModal(); renderAll(); if (onDone) onDone(); } }, h('div', { class: 'name' }, ORDINANCES[k].name), h('div', { class: 'desc' }, ORDINANCES[k].desc)))));
}
function showWin() {
  openModal(h('h2', { class: 'good' }, 'Grand Central Station is a success!'), h('p', {}, `You cleared week ${CONFIG.run.winWeek}. The quota keeps climbing in endless mode — how far can you go?`),
    h('div', { class: 'btnrow' }, h('button', { onclick: () => { closeModal(); showStart(); } }, 'New run'), h('button', { class: 'primary', onclick: () => { G.continueAfterWin(state); closeModal(); afterWeekStart(); } }, 'Keep going →')));
}
function showGameOver() {

    h('div', { class: 'kv' }, h('span', { class: 'k' }, 'Best week score'), h('span', {}, fmt(state.records.bestScore)), h('span', { class: 'k' }, 'Best traveller'), h('span', {}, fmt(state.records.bestTraveller)), h('span', { class: 'k' }, 'Seed'), h('span', {}, state.seed)),
    h('div', { class: 'btnrow' }, h('button', { onclick: () => { closeModal(); ui.mode = 'over'; } }, 'Inspect board'), h('button', { class: 'primary', onclick: () => { closeModal(); showStart(); } }, 'New run')));
}

function showStart() {
  const saved = loadRun();
  const seedInput = h('input', { type: 'text', placeholder: 'seed (optional)', style: 'font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px;width:160px' });
  const modes = h('div', { class: 'modes' });

    const rec = meta.byMode[k];

      h('div', { class: 'name' }, m.name, unlocked ? '' : ` 🔒 reach week ${m.unlockWeek}`), h('div', { class: 'desc' }, m.desc), rec ? h('div', { class: 'desc', style: 'margin-top:4px' }, `Best: week ${rec.bestWeek}, ${fmt(rec.bestScore)} pts`) : null));
  }

    h('p', {}, 'You run a transit hub. Each week, place a few tiles, then watch travellers cross the board. Every shop they pass multiplies what they are worth. Hit the quota or the run ends.'),
    h('p', { style: 'font-size:12px;color:var(--muted)' }, 'Transport tiles bring people but score badly. Amenities score well but bring nobody. Multiply first, then add: flat-add tiles want to be early on a route, multipliers late. Transports claim edge terrain permanently — rail and water lock an entire edge.'),
    saved ? h('div', { class: 'btnrow', style: 'justify-content:flex-start' }, h('button', { class: 'primary', onclick: () => { state = G.deserialize(saved); ui.started = true; closeModal(); ui.mode = 'idle'; afterWeekStart(); } }, 'Resume saved run')) : null,
    h('h3', {}, 'Choose a mode'), modes,
    h('div', { class: 'row', style: 'margin-top:12px' }, seedInput, h('span', { style: 'font-size:12px;color:var(--muted)' }, `Records: week ${meta.bestWeek} · best week ${fmt(meta.bestScore)} pts · best traveller ${fmt(meta.bestTraveller)}`)));
}
function newRun(modeKey, seedText) {
  const seed = seedText ? (isNaN(Number(seedText)) ? seedText : Number(seedText)) : null;
  state = G.createRun({ modeKey, seed });

}
function showMenu() {
  openModal(h('h2', {}, 'Menu'),
    h('div', { class: 'kv' }, h('span', { class: 'k' }, 'Mode'), h('span', {}, MODES[state.modeKey].name), h('span', { class: 'k' }, 'Seed'), h('span', {}, state.seed), h('span', { class: 'k' }, 'Week'), h('span', {}, state.week)),
    h('h3', {}, 'History'), h('table', { class: 'stats' }, h('tr', {}, h('th', {}, 'Week'), h('th', {}, 'Score'), h('th', {}, 'Quota'), h('th', {}, 'Money'), h('th', {}, 'Event')), ...state.history.map(x => h('tr', {}, h('td', {}, x.week), h('td', { class: x.passed ? 'good' : 'bad' }, fmt(x.score)), h('td', {}, fmt(x.quota)), h('td', {}, '+$' + fmt(x.money)), h('td', {}, x.event || '')))),
    h('div', { class: 'btnrow' }, h('button', { class: 'danger', onclick: () => { clearRun(); closeModal(); showStart(); } }, 'Abandon run'), h('button', { class: 'primary', onclick: closeModal }, 'Back')));
}

// ------------------------------------------------------------ boot
function boot() {
  const c = renderer.canvas;
  c.addEventListener('pointermove', onPointerMove);
  c.addEventListener('pointerleave', onPointerLeave);
  c.addEventListener('click', onClick);
  c.addEventListener('wheel', e => { if (ui.mode === 'place') { e.preventDefault(); rotate(e.deltaY > 0 ? 1 : -1); } }, { passive: false });
  c.addEventListener('contextmenu', e => { e.preventDefault(); if (ui.mode === 'place') rotate(1); else cancelMode(); });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', () => { if (state) renderer.resize(state.board); });
  $('btn-run').addEventListener('click', startWeek);
  $('btn-reroll').addEventListener('click', () => { const r = G.reroll(state); if (!r.ok) hint(r.reason); cancelMode(); renderAll(); });
  $('btn-wait').addEventListener('click', () => { const r = G.wait(state); if (!r.ok) hint(r.reason); cancelMode(); renderAll(); });
  $('btn-menu').addEventListener('click', () => { if (state) showMenu(); else showStart(); });
  const layout = (() => { try { return JSON.parse(localStorage.getItem('gcs.layout') || '{}'); } catch { return {}; } })();
  const applyLayout = () => {
    $('shop').classList.toggle('collapsed', !!layout.shopCollapsed);
    $('main').classList.toggle('side-collapsed', !!layout.sideCollapsed);
    $('side-tab').classList.toggle('hidden', !layout.sideCollapsed);
    try { localStorage.setItem('gcs.layout', JSON.stringify(layout)); } catch {}
    if (state) renderer.resize(state.board);
  };
  $('btn-shop-toggle').addEventListener('click', () => { layout.shopCollapsed = true; applyLayout(); });
  $('btn-shop-expand').addEventListener('click', () => { layout.shopCollapsed = false; applyLayout(); });
  $('btn-run-big').addEventListener('click', startWeek);
  $('btn-side-toggle').addEventListener('click', () => { layout.sideCollapsed = true; applyLayout(); });
  $('side-tab').addEventListener('click', () => { layout.sideCollapsed = false; applyLayout(); });
  applyLayout();
  document.querySelectorAll('#playback .speed').forEach(b => b.addEventListener('click', () => setSpeed(b.dataset.speed === 'skip' ? 'skip' : Number(b.dataset.speed))));
  state = G.createRun({ modeKey: 'terminal', seed: 1 }); // placeholder board behind the start modal
  renderer.resize(state.board);
  renderAll();
  requestAnimationFrame(frame);
  showStart();
}
boot();
